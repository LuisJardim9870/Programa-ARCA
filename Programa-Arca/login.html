<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="topo">
    <h2>ARCA</h2>
    </header>
    <div class="login"> <!-- Container para a página de login -->
             <h1>Login</h1> <!-- Título da página de login -->
            <form action="telainicial.html"> <!-- Formulário de login que redireciona para a página inicial após o envio -->
            <input type="email" placeholder="Email"> <!-- Campo de entrada para o email do usuário -->
            <input type="password" placeholder="Senha"> <!-- Campo de entrada para a senha do usuário -->
            <button type="submit">Entrar</button><!-- Botão de envio do formulário -->
            </form>
            <a href="#">Ainda não possui cadastro?</a> <!-- Link para a página de cadastro, caso o usuário ainda não tenha uma conta -->
            <p>ou</p>
            <a href="https://sso.acesso.gov.br/login?client_id=www.gov.br&authorization_id=19e5f4aee4e">Continuar com GOV.BR</a> <!-- Link para login usando a conta do GOV.BR -->
    </div>
</body>
</html>
